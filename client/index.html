<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>medieval-strategy</title>
<style>
  :root {
    --ink: #e8e4da;
    --dim: #9a9488;
    --faint: #6b665d;
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2c3038;
    --accent: #c9a227;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: crosshair; }

  .panel {
    position: fixed; background: var(--panel);
    border: 1px solid var(--line); border-radius: 3px;
  }

  #top {
    top: 10px; left: 10px; right: 10px;
    display: flex; align-items: center; gap: 14px;
    padding: 8px 12px; flex-wrap: wrap;
  }
  #crumbs { display: flex; align-items: center; gap: 6px; }
  #crumbs button {
    background: none; border: 1px solid var(--line); color: var(--ink);
    font: inherit; padding: 2px 8px; border-radius: 2px; cursor: pointer;
  }
  #crumbs button:hover { border-color: var(--accent); color: var(--accent); }
  #crumbs span.sep { color: var(--faint); }
  .spacer { flex: 1; }
  .stat { color: var(--dim); white-space: nowrap; }
  .stat b { color: var(--ink); font-weight: normal; }
  #dot { color: #b04a3a; }
  #dot.live { color: #5a9e5a; }

  #side {
    top: 62px; right: 10px; width: 320px;
    max-height: calc(100vh - 82px); overflow-y: auto; padding: 12px 14px;
  }
  #side h2 {
    margin: 0 0 2px; font-size: 14px; font-weight: normal;
    color: var(--accent); letter-spacing: 0.03em;
  }
  #side .addr { color: var(--faint); font-size: 11px; margin-bottom: 10px; }
  #side table { width: 100%; border-collapse: collapse; }
  #side td { padding: 2px 0; vertical-align: top; }
  #side td:first-child { color: var(--dim); padding-right: 10px; white-space: nowrap; }
  #side td:last-child { text-align: right; }
  #side .group {
    margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line);
    color: var(--faint); font-size: 11px; letter-spacing: 0.06em;
  }
  #side .hint { color: var(--faint); font-size: 11px; margin-top: 12px; }
  #side .none { color: var(--faint); }
  #actions { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  #actions button {
    background: none; border: 1px solid var(--line); color: var(--ink);
    font: inherit; padding: 4px 10px; border-radius: 2px; cursor: pointer; flex: 1;
  }
  #actions button:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  #actions button:disabled { color: var(--faint); cursor: default; }

  #legend {
    bottom: 10px; left: 10px; padding: 8px 12px;
    display: flex; gap: 12px; flex-wrap: wrap; max-width: 60vw;
  }
  #legend div { display: flex; align-items: center; gap: 5px; color: var(--dim); font-size: 11px; }
  #legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }

  #log {
    bottom: 10px; right: 10px; width: 320px; max-height: 150px;
    overflow-y: auto; padding: 8px 12px; font-size: 11px; color: var(--dim);
  }
  #log div { white-space: pre-wrap; }
  #log .warn { color: #d08a3a; }
  #log .bad { color: #d0563a; }
</style>
</head>
<body>
  <div id="stage"><canvas id="canvas"></canvas></div>

  <div id="top" class="panel">
    <div id="crumbs"></div>
    <div class="spacer"></div>
    <div class="stat"><span id="dot">&#9679;</span> <b id="who">connecting</b></div>
    <div class="stat">turn <b id="turn">0</b></div>
    <div class="stat">next <b id="next">-</b></div>
    <div class="stat">people <b id="people">0</b></div>
    <div class="stat">settled <b id="tiles">0</b></div>
    <div class="stat">kingdoms <b id="kingdoms">0</b></div>
    <div class="stat">yours <b id="realm">none</b></div>
  </div>

  <div id="side" class="panel">
    <h2 id="sel-title">nothing selected</h2>
    <div class="addr" id="sel-addr">click the map</div>
    <div id="sel-body"></div>
    <div id="actions"></div>
    <div class="hint" id="hint"></div>
  </div>

  <div id="legend" class="panel"></div>
  <div id="log" class="panel"></div>

  <script type="module" src="/client/src/main.ts"></script>
</body>
</html>
